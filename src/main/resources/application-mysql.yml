# MySQL 9.5 环境。先执行 sql/01_schema.sql 与 sql/02_data.sql。
# 可通过环境变量覆盖连接信息：DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cms_db}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    # 不提供默认密码，避免把任何真实/猜测密码写入仓库；请通过环境变量注入
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 10000
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false
