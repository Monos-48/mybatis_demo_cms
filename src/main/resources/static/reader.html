<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1524">
    <meta name="description" content="Atlas CMS 读者端：浏览公开的已发布文章。">
    <title>Atlas CMS · 读者端</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- 静态资源版本号：前端发布时递增 ?v=，避免浏览器继续使用旧脚本。 -->
    <link rel="stylesheet" href="css/reader.css?v=1.1.0">
</head>
<body>
<header class="reader-header">
    <a class="reader-brand" href="reader.html">
        <span class="brand-mark">A</span>
        <span>Atlas CMS · 读者端</span>
    </a>
    <div class="reader-header-actions">
        <span class="reader-status" id="reader-status">公开阅读</span>
        <a class="reader-link" href="index.html#register">注册账号</a>
        <a class="reader-link" href="index.html">管理后台登录</a>
    </div>
</header>

<section class="reader-hero">
    <p class="kicker">CONTENT READER</p>
    <h1>阅读，从这里开始</h1>
    <p>只展示已发布、且分类有效的文章内容。</p>
    <form class="reader-search" id="reader-search">
        <input id="reader-keyword" maxlength="100" placeholder="搜索文章标题…" aria-label="搜索文章标题">
        <button type="submit">搜索</button>
    </form>
</section>

<main class="reader-layout">
    <aside class="reader-sidebar">
        <h2>内容分类</h2>
        <nav id="reader-categories" class="reader-categories" aria-label="内容分类"></nav>
    </aside>
    <section class="reader-content">
        <div id="reader-list-view">
            <div class="reader-list-head">
                <h2 id="reader-list-title">全部文章</h2>
                <span id="reader-list-count" class="muted"></span>
            </div>
            <div id="reader-articles" class="reader-articles"></div>
            <div class="reader-pager" id="reader-pager"></div>
        </div>
        <article id="reader-detail-view" class="reader-detail" hidden>
            <button type="button" class="reader-back" id="reader-back">← 返回列表</button>
            <h1 id="reader-detail-title"></h1>
            <p class="reader-meta" id="reader-detail-meta"></p>
            <div class="reader-body" id="reader-detail-body"></div>
        </article>
    </section>
</main>

<footer class="reader-footer">Atlas CMS · 公开阅读接口 /api/public</footer>
<script src="js/reader.js?v=1.1.0"></script>
</body>
</html>
