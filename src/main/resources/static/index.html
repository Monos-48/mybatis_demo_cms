<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1524">
    <meta name="description" content="Atlas CMS 内容管理系统：多级分类、审核发布、RBAC 权限与操作审计。">
    <title>Atlas CMS · 内容管理系统</title>
    <!-- 全部使用相对路径：部署到 Tomcat 的非根 context path 时也能正确加载。 -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="boot-screen" class="boot-screen">
    <div class="boot-brand"><span class="brand-mark">A</span><b>Atlas CMS</b></div>
    <span class="boot-spinner" aria-hidden="true"></span>
    <p>正在连接内容管理服务…</p>
</div>

<div id="login-screen" class="login-screen hidden">
    <div class="login-visual">
        <div class="login-brand">
            <span class="brand-mark">A</span>
            <span>Atlas CMS</span>
        </div>
        <h1>让内容生产<br>有序、可控、可追溯</h1>
        <p>内容分类 · 审核发布 · RBAC 权限 · 操作审计</p>
        <div class="login-points">
            <span>多级分类树</span>
            <span>审核状态机</span>
            <span>接口级权限</span>
        </div>
    </div>
    <div class="login-panel">
        <div class="login-card">
            <div class="login-title">登录管理后台</div>
            <p class="login-subtitle">使用演示账号或系统分配的账号登录</p>
            <form id="login-form" novalidate>
                <label class="field">
                    <span>用户名</span>
                    <input id="login-username" name="username" autocomplete="username" maxlength="32"
                           placeholder="请输入用户名" value="admin" required>
                </label>
                <label class="field">
                    <span>密码</span>
                    <span class="password-wrap">
                        <input id="login-password" name="password" type="password"
                               autocomplete="current-password" maxlength="32"
                               placeholder="请输入密码" value="admin123" required>
                        <button type="button" class="password-toggle" id="password-toggle"
                                aria-label="显示密码" aria-pressed="false">显示</button>
                    </span>
                </label>
                <div class="login-options">
                    <label class="check-inline">
                        <input type="checkbox" id="remember-username"> 记住用户名
                    </label>
                    <span class="small muted">30 分钟无操作自动退出</span>
                </div>
                <p id="login-error" class="form-error" role="alert" hidden></p>
                <button class="btn btn-primary btn-block" type="submit" id="login-button">登 录</button>
            </form>
            <div class="demo-accounts" id="demo-accounts">
                <div class="demo-title">演示账号（点击填充）</div>
                <button type="button" data-user="admin" data-pass="admin123"><b>admin</b><span>超级管理员</span></button>
                <button type="button" data-user="editor" data-pass="editor123"><b>editor</b><span>内容编辑</span></button>
                <button type="button" data-user="author" data-pass="author123"><b>author</b><span>内容作者</span></button>
                <button type="button" data-user="viewer" data-pass="viewer123"><b>viewer</b><span>只读访客</span></button>
            </div>
            <div class="login-switch" id="login-switch">
                <span class="small muted">还没有账号？</span>
                <button type="button" class="btn-link" id="show-register">注册账号</button>
                <span class="muted small">·</span>
                <a class="btn-link" href="reader.html">进入读者端</a>
            </div>
            <form id="register-form" class="register-form" novalidate hidden>
                <div class="login-title">注册读者账号</div>
                <p class="login-subtitle">注册后需管理员审批，通过后即可登录管理后台。</p>
                <label class="field"><span>用户名</span>
                    <input id="reg-username" maxlength="32" autocomplete="username"
                           placeholder="4-32 位字母、数字或下划线" required></label>
                <label class="field"><span>昵称</span>
                    <input id="reg-nickname" maxlength="20" placeholder="2-20 个字符" required></label>
                <label class="field"><span>邮箱</span>
                    <input id="reg-email" type="email" maxlength="100" placeholder="选填，用于联系"></label>
                <label class="field"><span>密码</span>
                    <input id="reg-password" type="password" maxlength="32"
                           autocomplete="new-password" placeholder="8-32 位，同时包含字母和数字" required></label>
                <p id="register-error" class="form-error" role="alert" hidden></p>
                <button class="btn btn-primary btn-block" type="submit" id="register-button">注 册</button>
                <div class="login-switch">
                    <span class="small muted">已有账号？</span>
                    <button type="button" class="btn-link" id="show-login">返回登录</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div id="app" class="app hidden">
    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <span class="brand-mark">A</span>
            <div><b>Atlas CMS</b><small>内容管理平台</small></div>
        </div>
        <nav id="nav" class="nav" aria-label="主导航"></nav>
        <div class="sidebar-foot">
            <div class="service-line">
                <span id="service-dot" class="dot"></span>
                <span id="service-status">正在检测服务…</span>
            </div>
            <a class="sidebar-reader" href="reader.html" target="_blank" rel="noopener">读者端 ↗</a>
            <small class="sidebar-version">v1.0.0 · Spring Boot 2.7</small>
        </div>
    </aside>
    <div class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button type="button" class="sidebar-toggle" id="sidebar-toggle"
                        aria-label="打开导航" aria-controls="sidebar" aria-expanded="false">☰</button>
                <div>
                    <div class="page-kicker" id="page-kicker">CONTENT OPERATIONS</div>
                    <h2 id="page-title">工作台</h2>
                </div>
            </div>
            <div class="topbar-right">
                <span class="role-chip" id="role-chip"></span>
                <div class="avatar" id="avatar">A</div>
                <div class="user-meta">
                    <b id="user-name"></b>
                    <small id="user-account"></small>
                </div>
                <button class="btn btn-ghost btn-sm" id="logout-button">退出</button>
            </div>
        </header>
        <main id="content" class="content" tabindex="-1"></main>
    </div>
</div>

<div id="modal-root"></div>
<div id="confirm-root"></div>
<div id="toast-root" role="status" aria-live="polite"></div>
<noscript><div class="noscript">本系统需要启用 JavaScript 才能使用，请在浏览器设置中开启后刷新页面。</div></noscript>
<script src="js/app.js"></script>
</body>
</html>
