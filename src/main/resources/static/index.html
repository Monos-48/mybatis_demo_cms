<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas CMS · 内容管理系统</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="login-screen" class="login-screen">
    <div class="login-visual">
        <div class="login-brand">
            <span class="brand-mark">A</span>
            <span>Atlas CMS</span>
        </div>
        <h1>让内容生产<br>有序、可控、可追溯</h1>
        <p>内容分类 · 审核发布 · RBAC 权限 · 操作审计</p>
        <div class="login-points">
            <span>多级分类树</span>
            <span>审核状态机</span>
            <span>接口级权限</span>
        </div>
    </div>
    <div class="login-panel">
        <div class="login-card">
            <div class="login-title">登录管理后台</div>
            <p class="login-subtitle">使用演示账号或系统分配的账号登录</p>
            <form id="login-form">
                <label class="field">
                    <span>用户名</span>
                    <input id="login-username" name="username" autocomplete="username" value="admin" required>
                </label>
                <label class="field">
                    <span>密码</span>
                    <input id="login-password" name="password" type="password" autocomplete="current-password" value="admin123" required>
                </label>
                <button class="btn btn-primary btn-block" type="submit" id="login-button">登 录</button>
            </form>
            <div class="demo-accounts">
                <div class="demo-title">演示账号（点击填充）</div>
                <button type="button" data-user="admin" data-pass="admin123"><b>admin</b><span>超级管理员</span></button>
                <button type="button" data-user="editor" data-pass="editor123"><b>editor</b><span>内容编辑</span></button>
                <button type="button" data-user="author" data-pass="author123"><b>author</b><span>内容作者</span></button>
                <button type="button" data-user="viewer" data-pass="viewer123"><b>viewer</b><span>只读访客</span></button>
            </div>
        </div>
    </div>
</div>

<div id="app" class="app hidden">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <span class="brand-mark">A</span>
            <div><b>Atlas CMS</b><small>内容管理平台</small></div>
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="sidebar-foot">
            <span class="dot"></span> 服务运行中
        </div>
    </aside>
    <div class="main">
        <header class="topbar">
            <div>
                <div class="page-kicker" id="page-kicker">CONTENT OPERATIONS</div>
                <h2 id="page-title">工作台</h2>
            </div>
            <div class="topbar-right">
                <span class="role-chip" id="role-chip"></span>
                <div class="avatar" id="avatar">A</div>
                <div class="user-meta">
                    <b id="user-name"></b>
                    <small id="user-account"></small>
                </div>
                <button class="btn btn-ghost btn-sm" id="logout-button">退出</button>
            </div>
        </header>
        <main id="content" class="content"></main>
    </div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>
<script src="/js/app.js"></script>
</body>
</html>
