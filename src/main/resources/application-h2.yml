# 零配置演示/测试环境：H2 内存数据库，MySQL 兼容模式。
# 生产/课程验收可切换 --spring.profiles.active=mysql 使用真实 MySQL 9.5。
spring:
  datasource:
    url: jdbc:h2:mem:cms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      data-locations: classpath:db/data-h2.sql
      encoding: UTF-8
      continue-on-error: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
